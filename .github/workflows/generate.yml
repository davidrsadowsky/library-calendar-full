name: Generate Calendar

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate calendar
        env:
          BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          BREVO_SMTP_PASS: ${{ secrets.BREVO_SMTP_PASS }}
        run: node fetch_calendars.js

      - name: Commit cache file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events_cache.json scraper_health.json
          git diff --staged --quiet || git commit -m "Update events cache"
          # These files are purely machine-generated with no manual edits, so on
          # conflict the freshly-generated version always wins outright — this
          # merge strategy resolves automatically and can never leave literal
          # conflict-marker text committed into the file (which happened twice
          # with the old "pull --rebase" approach when a push landed mid-run).
          git fetch origin main
          git merge origin/main --no-edit -X ours
          git push

      - name: Move output to deploy folder
        run: mkdir dist && mv *.html sitemap.xml dist/ && cp favicon.svg favicon.ico apple-touch-icon.png dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
